<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Change Password • InsChat</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-gradient-to-br from-cyan-50 via-white to-purple-50">


<!-- HEADER -->

<div class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b">

<div class="max-w-xl mx-auto flex items-center justify-between px-4 py-4">

<a href="javascript:history.back()"
class="text-xl font-bold text-gray-700">

←

</a>


<h2 class="text-xl font-extrabold bg-gradient-to-r from-cyan-500 via-blue-600 via-purple-600 to-yellow-500 bg-clip-text text-transparent">

Change Password

</h2>


<div class="w-6"></div>

</div>

</div>



<!-- MAIN -->

<div class="max-w-xl mx-auto p-4">


<div class="bg-white rounded-3xl shadow-xl p-6 border border-gray-100">


{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="mb-4 p-4 rounded-xl
{% if category == 'success' %}
bg-green-100 text-green-700
{% else %}
bg-red-100 text-red-700
{% endif %}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}



<form method="POST"
class="space-y-5">


<div>

<label class="block font-bold text-gray-700 mb-2">

Current Password

</label>

<input
type="password"
name="old_password"
required
placeholder="Enter current password"
class="w-full px-4 py-4 rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500">

</div>



<div>

<label class="block font-bold text-gray-700 mb-2">

New Password

</label>

<input
type="password"
name="new_password"
required
placeholder="Enter new password"
class="w-full px-4 py-4 rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500">

</div>



<div>

<label class="block font-bold text-gray-700 mb-2">

Confirm New Password

</label>

<input
type="password"
name="confirm_password"
required
placeholder="Confirm new password"
class="w-full px-4 py-4 rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500">

</div>



<div class="text-right">

<a href="/auth/forgot_password"
class="text-sm font-bold text-blue-600">

Forgot password?

</a>

</div>



<button
type="submit"
class="w-full py-4 rounded-2xl font-bold text-white shadow-xl
bg-gradient-to-r from-cyan-500 via-blue-600 via-purple-600 to-yellow-500
hover:scale-[1.02] transition">

Change Password

</button>


</form>


</div>


</div>



<script>

window.me = {{ session.get("user_id")|tojson }};

</script>


<script src="/static/js/global_call.js"></script>


</body>

</html>
