<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report • InsChat</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

<div class="max-w-xl mx-auto p-5">

<a href="javascript:history.back()"
   class="text-cyan-400 text-lg">
← Back
</a>

<h1 class="text-3xl font-bold mt-5">
📃 Report
</h1>

<p class="text-gray-400 mt-2">
Help us understand what's happening.
Your report is anonymous.
</p>

<form method="POST" action="/report/submit" class="mt-6 space-y-5">

<input type="hidden" name="target_type" value="{{ target_type }}">
<input type="hidden" name="target_id" value="{{ target_id }}">
<input type="hidden" name="owner_id" value="{{ owner_id }}">

<div>

<label class="block mb-2 font-semibold">
Reason
</label>

<select
name="reason"
required
class="w-full bg-zinc-900 rounded-xl p-3 outline-none">

<option value="">Select reason</option>

<option value="Spam">Spam</option>

<option value="Scam or fraud">
Scam or fraud
</option>

<option value="Fake account">
Fake account
</option>

<option value="Harassment">
Bullying or harassment
</option>

<option value="Hate speech">
Hate speech
</option>

<option value="Violence">
Violence
</option>

<option value="Adult content">
Nudity or sexual content
</option>

<option value="Child safety">
Child safety
</option>

<option value="Illegal goods">
Illegal goods
</option>

<option value="False information">
False information
</option>

<option value="Copyright infringement">
Copyright infringement
</option>

<option value="Trademark infringement">
Trademark infringement
</option>

<option value="Other">
Other
</option>

</select>

</div>

<div>

<label class="block mb-2 font-semibold">
Additional details (optional)
</label>

<textarea
name="details"
rows="5"
placeholder="Tell us more..."
class="w-full bg-zinc-900 rounded-xl p-3 outline-none resize-none"></textarea>

</div>

<button
type="submit"
class="w-full bg-red-600 hover:bg-red-700 rounded-xl p-4 font-bold">

Submit Report

</button>

</form>

</div>

</body>
</html>
