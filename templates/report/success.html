<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Submitted • InsChat</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-black text-white flex items-center justify-center min-h-screen">

<div class="max-w-md w-full mx-auto p-6 text-center">

    <div class="text-7xl mb-6">
        ✅
    </div>

    <h1 class="text-3xl font-bold">
        Report Submitted
    </h1>

    <p class="text-gray-400 mt-5 leading-7">
        Thank you for helping keep <b>InsChat</b> safe.
        <br><br>
        We've received your report and our team will review it.
        If the reported content violates the InsChat Community Guidelines,
        appropriate action will be taken.
    </p>

    <div class="bg-zinc-900 rounded-2xl p-4 mt-8 text-sm text-gray-300">
        Your identity will remain confidential.
    </div>

    <a href="/posts/feed"
       class="block mt-8 w-full bg-cyan-500 hover:bg-cyan-600 transition rounded-xl py-4 font-bold text-lg">
        Done
    </a>

</div>

</body>
</html>
