<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Account Center • InsChat</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-gradient-to-br from-cyan-50 via-white to-purple-50">


<!-- HEADER -->

<div class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b">

    <div class="max-w-xl mx-auto flex items-center justify-between px-4 py-4">

        <a href="javascript:history.back()"
           class="text-xl font-bold text-gray-700">
            ←
        </a>

        <h2 class="text-xl font-extrabold bg-gradient-to-r from-cyan-500 via-blue-600 via-purple-600 to-yellow-500 bg-clip-text text-transparent">
            Account Center
        </h2>

        <div class="w-6"></div>

    </div>

</div>


<!-- MAIN -->

<div class="max-w-xl mx-auto p-4 space-y-4">


    <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">


        <!-- CHANGE PASSWORD -->

        <a href="/profile/change_password"
           class="flex items-center justify-between px-5 py-5 hover:bg-gray-50 transition">

            <div>

                <div class="font-bold text-gray-900">
                    🔑 Change Password
                </div>

                <div class="text-sm text-gray-500">
                    Update your account password
                </div>

            </div>

            <span class="text-gray-400 text-xl">
                ›
            </span>

        </a>


        <hr>


        <!-- FORGOT PASSWORD -->

        <a href="/auth/forgot-password"
           class="flex items-center justify-between px-5 py-5 hover:bg-gray-50 transition">

            <div>

                <div class="font-bold text-gray-900">
                    🔐 Forgot Password
                </div>

                <div class="text-sm text-gray-500">
                    Reset your password using OTP
                </div>

            </div>

            <span class="text-gray-400 text-xl">
                ›
            </span>

        </a>


    </div>


</div>


<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

window.me = {{ session.get("user_id")|tojson }};

</script>

<script src="/static/js/global_call.js"></script>


</body>

</html>
