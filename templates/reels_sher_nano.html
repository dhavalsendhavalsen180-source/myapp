<!-- =========================
     INSCHAT REEL SHARE SHEET
========================= -->

<div id="shareModal"
style="position:fixed;inset:0;background:rgba(0,0,0,.60);display:none;z-index:99999;align-items:flex-end;justify-content:center;font-family:system-ui;backdrop-filter:blur(8px);">

  <div style="width:100%;max-width:520px;height:80vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -10px 35px rgba(0,0,0,.35);">

    <!-- HANDLE -->
    <div style="width:50px;height:5px;background:#d1d5db;border-radius:999px;margin:12px auto 8px;"></div>

    <!-- TITLE -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;">
      <span style="width:24px;"></span>
      <span style="font-size:18px;font-weight:700;">Share Reel</span>
      <button onclick="closeShare()" aria-label="Close" style="font-size:24px;color:#666;">×</button>
    </div>

    <!-- SEARCH -->
    <div style="padding:12px;">
      <input id="shareSearch" placeholder="Search friends..." oninput="filterUsers()"
      style="width:100%;box-sizing:border-box;padding:12px 14px;border:none;outline:none;background:#f3f4f6;border-radius:14px;font-size:14px;">
    </div>

    <!-- USERS -->
    <div id="shareUsers"
    style="flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:12px;">
    </div>

    <!-- ACTIONS -->
    <div style="border-top:1px solid #eee;padding:12px;background:#fff;">

      <div style="display:flex;justify-content:space-around;align-items:center;margin-bottom:12px;">

        <button type="button" onclick="shareWhatsApp()" style="text-align:center;">
          <div style="width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff;background:linear-gradient(135deg,#25D366,#1ebe5d);">📱</div>
          <div style="font-size:11px;font-weight:700;margin-top:5px;">WhatsApp</div>
        </button>

        <button type="button" onclick="shareTelegram()" style="text-align:center;">
          <div style="width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff;background:linear-gradient(135deg,#229ED9,#0088cc);">✈️</div>
          <div style="font-size:11px;font-weight:700;margin-top:5px;">Telegram</div>
        </button>

        <button type="button" onclick="copyLink()" style="text-align:center;">
          <div style="width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff;background:linear-gradient(135deg,#7c3aed,#2563eb);">🔗</div>
          <div style="font-size:11px;font-weight:700;margin-top:5px;">Copy Link</div>
        </button>

      </div>

      <button id="shareSendBtn" type="button" onclick="sendSelectedReels()" disabled
      style="width:100%;padding:12px;border-radius:12px;background:#2563eb;color:white;font-weight:700;opacity:.5;">
        Select a friend
      </button>

      <div id="shareStatus" role="status"
      style="font-size:12px;text-align:center;margin-top:8px;color:#555;"></div>
    </div>

  </div>
</div>

<script>
let currentShareReel = null;
let allUsers = [];
let selectedShareUsers = new Set();
let shareSending = false;

/* OPEN SHARE SHEET */
async function openShare(reelId) {
  currentShareReel = reelId;
  selectedShareUsers.clear();
  shareSending = false;

  document.getElementById("shareModal").style.display = "flex";
  document.getElementById("shareSearch").value = "";
  document.getElementById("shareStatus").textContent = "";

  const box = document.getElementById("shareUsers");
  box.innerHTML = '<div style="grid-column:span 4;text-align:center;color:#777;">Loading...</div>';
  updateShareSendButton();

  try {
    const res = await fetch("/reels/api/following_users");
    if (!res.ok) throw new Error("Could not load users");

    const data = await res.json();
    allUsers = data.users || [];
    renderUsers(allUsers);
  } catch (err) {
    box.innerHTML = '<div style="grid-column:span 4;text-align:center;color:#b91c1c;">Could not load users. Try again.</div>';
  }
}

/* RENDER USERS */
function renderUsers(users) {
  const box = document.getElementById("shareUsers");
  box.innerHTML = "";

  if (!users || users.length === 0) {
    box.innerHTML = '<div style="grid-column:span 4;text-align:center;color:#777;font-size:13px;">No users found</div>';
    return;
  }

  users.forEach(user => {
    const id = String(user.id);
    const selected = selectedShareUsers.has(id);

    const item = document.createElement("button");
    item.type = "button";
    item.style.cssText =
      "position:relative;text-align:center;cursor:pointer;min-width:0;padding:5px;border-radius:12px;border:2px solid " +
      (selected ? "#2563eb" : "transparent") +
      ";background:" + (selected ? "#eff6ff" : "#fff") + ";";

    const img = document.createElement("img");
    img.src = user.avatar || "/static/default_dp.png";
    img.onerror = function() { this.src = "/static/default_dp.png"; };
    img.style.cssText =
      "width:60px;height:60px;margin:auto;border-radius:50%;object-fit:cover;border:2px solid " +
      (selected ? "#2563eb" : "#eee") + ";";

    const name = document.createElement("div");
    name.textContent = user.username || "User";
    name.style.cssText =
      "font-size:12px;margin-top:6px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";

    item.appendChild(img);
    item.appendChild(name);

    if (selected) {
      const tick = document.createElement("span");
      tick.textContent = "✓";
      tick.style.cssText =
        "position:absolute;top:0;right:0;width:23px;height:23px;border-radius:50%;background:#2563eb;color:white;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid white;";
      item.appendChild(tick);
    }

    item.onclick = () => {
      if (selectedShareUsers.has(id)) {
        selectedShareUsers.delete(id);
      } else {
        selectedShareUsers.add(id);
      }

      document.getElementById("shareStatus").textContent = "";
      renderUsers(getFilteredUsers());
      updateShareSendButton();
    };

    box.appendChild(item);
  });
}

/* SEARCH */
function getFilteredUsers() {
  const val = document.getElementById("shareSearch").value.toLowerCase().trim();
  return allUsers.filter(u => (u.username || "").toLowerCase().includes(val));
}

function filterUsers() {
  renderUsers(getFilteredUsers());
}

/* SEND BUTTON */
function updateShareSendButton() {
  const btn = document.getElementById("shareSendBtn");
  const count = selectedShareUsers.size;

  btn.disabled = count === 0 || shareSending;
  btn.style.opacity = btn.disabled ? ".5" : "1";
  btn.style.background = "#2563eb";
  btn.textContent = shareSending
    ? "Sending..."
    : count === 0
      ? "Select a friend"
      : `Send${count > 1 ? " (" + count + ")" : ""} ➤`;
}

/* CLOSE */
function closeShare() {
  document.getElementById("shareModal").style.display = "none";
}

/* SEND REEL TO SELECTED FRIENDS */
async function sendSelectedReels() {
  if (shareSending || !currentShareReel || selectedShareUsers.size === 0) return;

  shareSending = true;
  updateShareSendButton();

  const status = document.getElementById("shareStatus");
  let sent = 0;
  const failures = [];

  for (const userId of selectedShareUsers) {
    try {
      const res = await fetch(
        `/reels/share_to_user/${encodeURIComponent(currentShareReel)}/${encodeURIComponent(userId)}`,
        { method: "POST" }
      );

      let data = {};
      try {
        data = await res.json();
      } catch (_) {}

      if (res.ok && data.ok) {
        sent++;
      } else {
        failures.push(data.error || "A share failed");
      }
    } catch (err) {
      failures.push("Network error");
    }
  }

  shareSending = false;
  updateShareSendButton();

  if (sent > 0) {
    closeShare();
    return;
  }

  status.textContent = failures[0] || "Share failed. Please try again.";
  status.style.color = "#b91c1c";
}

/* REEL LINK */
function getReelShareUrl() {
  const url = new URL("/reels", window.location.origin);
  url.searchParams.set("open", String(currentShareReel));
  return url.toString();
}

/* COPY */
async function copyLink() {
  if (!currentShareReel) return;

  const url = getReelShareUrl();

  try {
    await navigator.clipboard.writeText(url);
    const status = document.getElementById("shareStatus");
    status.textContent = "Link copied ✓";
    status.style.color = "#15803d";
  } catch (_) {
    prompt("Copy reel link:", url);
  }
}

/* WHATSAPP */
function shareWhatsApp() {
  if (!currentShareReel) return;
  window.open(
    `https://wa.me/?text=${encodeURIComponent(getReelShareUrl())}`,
    "_blank"
  );
}

/* TELEGRAM */
function shareTelegram() {
  if (!currentShareReel) return;
  window.open(
    `https://t.me/share/url?url=${encodeURIComponent(getReelShareUrl())}`,
    "_blank"
  );
}

/* CLOSE WHEN BACKDROP IS TAPPED */
document.getElementById("shareModal").onclick = function(e) {
  if (e.target.id === "shareModal") closeShare();
};
</script>
